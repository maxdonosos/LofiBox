# Compila Lo-Fi Box en Mac y Windows reales y genera los instaladores.
# - Cada push / ejecución manual: instaladores como "artifacts" del workflow.
# - Push de un tag vX.Y.Z: además crea un Release de GitHub con ambos instaladores.
name: Build installers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOFIBOX_COPY_AFTER_BUILD=OFF
             "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: DSP test
        run: ./build/LoFiBoxDSPTest_artefacts/Release/LoFiBoxDSPTest

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/LoFiBox_artefacts/Release/AU/Lo-Fi Box.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf LfB1 Lfbx

      - name: Build .pkg
        env:
          MAC_APP_SIGN_ID:       ${{ secrets.MAC_APP_SIGN_ID }}
          MAC_INSTALLER_SIGN_ID: ${{ secrets.MAC_INSTALLER_SIGN_ID }}
          NOTARY_APPLE_ID:       ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID:        ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD:       ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VER="${VERSION#v}"
          bash installer/mac/build_pkg.sh build/LoFiBox_artefacts/Release "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: LoFiBox-mac
          path: dist/*.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64 -DLOFIBOX_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP test
        run: .\build\LoFiBoxDSPTest_artefacts\Release\LoFiBoxDSPTest.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = "$env:VERSION".TrimStart('v')
          & $iscc "/DArtefacts=$env:GITHUB_WORKSPACE\build\LoFiBox_artefacts\Release" "/DVersion=$ver" installer\windows\LoFiBox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: LoFiBox-windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
